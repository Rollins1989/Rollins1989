name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

# Prevent this workflow from pushing to main at the same time as the 3D workflow.
concurrency:
  group: profile-main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5
          AUTO_PUSH: true
          THEME: "dracula"
          ANIMATION: "load"
