name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%234c1d95&color_dots=%23f3e8ff,%23e9d5ff,%23d8b4fe,%23c084fc,%23a855f7
            dist/github-snake-dark.svg?color_snake=%23e9d5ff&color_dots=%232e1065,%234c1d95,%236d28d9,%238b5cf6,%23a855f7

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
