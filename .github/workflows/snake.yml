name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%234c1d95&color_dots=%23f5f3ff,%23ddd6fe,%23c4b5fd,%23a78bfa,%238b5cf6
            dist/github-snake-dark.svg?color_snake=%23a78bfa&color_dots=%234c1d95,%235b21b6,%236d28d9,%238b5cf6,%23a78bfa

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
